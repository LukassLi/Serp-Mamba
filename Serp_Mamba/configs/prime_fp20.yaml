# PRIME-FP20 UWF-SLO 视网膜血管分割数据集配置
# 复现 BaseDataSets 对 PRIME-FP20 的硬编码行为

name: "PRIME-FP20"
description: "PRIME-FP20 UWF-SLO retinal vessel segmentation dataset"

# 数据集根目录（通过 --root_path 覆盖，或在此处指定实际路径）
root_dir: "PRIME-FP20_DataPort/PRIME-FP20-after-VAL1"

# 目录布局：{split} 由 split_map 映射后替换
image_dir: "{split}_image"
label_dir: "{split}_label"

# split 名到实际目录名的映射
split_map:
  train: "training"
  val: "val"
  test: "test"

# 文件匹配
image_ext: ".tif"
label_ext: ".png"

# 标签文件名推导（从图像文件名推导标签文件名）
label_name_transform:
  - replace: ["Img", "Label"]
  - replace: ["tif", "png"]

# 图像属性
image_mode: "L"           # 灰度加载
input_channels: 1         # 模型输入通道数
label_threshold: 0        # label[label > 0] = 1
label_rgb_mode: "mean"    # RGB 标签转单通道方式

# 训练默认超参（可被 argparse 覆盖）
patch_size: [1024, 1024]
batch_size: 1
max_iterations: 16000
base_lr: 0.0001
num_classes: 2
